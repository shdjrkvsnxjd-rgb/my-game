<style>

    --bg:#1c1712; --panel:#2a221b; --line:#3d3227;
    --warm:#e8c9a0; --dim:#a89275; --hot:#e07a5f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--warm);
    font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
    font-size:15px;line-height:1.65;padding-bottom:160px}
  header{position:sticky;top:0;background:linear-gradient(#1c1712,#1c1712 75%,transparent);
    padding:10px 14px;z-index:10;border-bottom:1px solid var(--line)}
  .clock{font-size:13px;color:var(--dim);letter-spacing:.5px}
  .attack-now{font-size:15px;margin-top:2px}
  .attack-now .tag{color:var(--hot)}
  main{padding:12px 14px}
  .log-item{border-left:2px solid var(--line);padding:8px 0 16px 12px;margin-left:4px}
  .log-item.star{border-left-color:var(--hot)}
  .log-meta{font-size:12px;color:var(--dim);margin-bottom:4px}
  .log-title{font-weight:600;margin-bottom:6px}
  .scene{margin:6px 0}
  .scene .lbl{display:inline-block;font-size:11px;color:var(--hot);
    border:1px solid var(--hot);border-radius:3px;padding:0 4px;margin-right:6px;vertical-align:2px}
  .voice{color:#d8c3a0;font-style:italic;font-size:14px}
  .narr{color:var(--dim);font-size:13px;margin-top:6px}
  footer{position:fixed;bottom:0;left:0;right:0;background:var(--panel);
    border-top:1px solid var(--line);padding:8px 10px;z-index:10}
  .ops{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .ops button{flex:0 0 auto;background:#33291f;color:var(--warm);border:1px solid var(--line);
    border-radius:8px;padding:10px 14px;font-size:14px;min-width:74px}
  .ops button:active{background:#443728}
  .sub{display:flex;gap:6px;overflow-x:auto;margin-top:6px;padding-bottom:2px;min-height:34px}
  .sub button{flex:0 0 auto;background:#241d16;color:var(--dim);border:1px solid var(--line);
    border-radius:20px;padding:6px 12px;font-size:13px}
  .sub button:active{background:#33291f}
  .loading{color:var(--dim);font-size:13px;padding:6px 0}
  .err{color:#e07070;font-size:13px;padding:6px 0;line-height:1.4}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:30px 0}
</style>

function fmtClock(){
  const h = String(Math.floor(state.minutes/60)%24).padStart(2,'0');
  const m = String(state.minutes%60).padStart(2,'0');
  return `第 ${state.day} 天 ${h}:${m}`;
}
function advance(minutes){
  state.minutes += minutes;
  while(state.minutes >= 24*60){ state.minutes -= 24*60; state.day += 1; }
}
function renderClock(){ document.getElementById('clock').textContent = fmtClock(); }

    `倒贴风格:${c.倒贴签名} 语言:${c.language}`
  )).join('\n');
  const recent = state.logs.slice(-3).map(l=>`[第${l.day}天] ${l.title}`).join('\n') || '（无）';

  const sys = `你是一部情色群像小说的引擎。设定与铁律：${JSON.stringify(setting)}`;
  const user = `
攻当前状态：${state.attack.当前在做什么}（心情：${state.attack.今日心情}）
玩家操作：${op} — ${detail}

七位受简述：
${charsBrief}

最近事件：
${recent}

请生成"一个事件"，严格遵守铁律：
- 攻不动感情、轻佻有趣；受情感浓度高、外放倒贴。
- 受不写内心独白，痛与爱只靠直白对话/动作/神态/细节呈现。
- 情色场景四件套齐备且具体露骨（身体描写、语言描写、神态描写、细节描写），落到物件与动作。
- 攻的话/动作保持轻佻顺手，可在旁白里带"（手里还在翻那本书）"这种碎念。
- 允许小概率(约15%)出人意料，但仍须符合该角色底色。

以 JSON 返回，不要多余文字：
{
 "涉事受":["名字"],
 "event_title":"一句话事件标题",
 "duration_min":25,
 "身体描写":"...",
 "语言描写":"（受的直白台词）",
 "神态描写":"...",
 "细节描写":"...",
 "攻的碎念":"（旁白式短句）",
 "star":false,
 "status_change":{"名字":{"心情":"...","性欲":数值,"位置":"..."}}
}`;

  const endpoint = CONFIG.baseURL + "/chat/completions";
  const url = CONFIG.useProxy ? (PROXY + encodeURIComponent(endpoint)) : endpoint;

  const res = await fetch(url, {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer " + CONFIG.apiKey
    },
    body: JSON.stringify({
      model: CONFIG.model,
      messages:[
        {role:"system", content:sys},
        {role:"user", content:user}
      ],
      temperature: 1.0,
      response_format:{type:"json_object"}
    })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> "");
    throw new Error("API 请求失败："+res.status+" "+t.slice(0,120));
  }
  const data = await res.json();
  let txt = data.choices[0].message.content.trim();
  txt = txt.replace(/^```json/,'').replace(/^```/,'').replace(/```$/,'').trim();
  return JSON.parse(txt);
}

async function runEvent(op, detail){
  const sub = document.getElementById('sub');
  if(CONFIG.apiKey.includes("在这里填")){
    sub.innerHTML = '<span class="err">请先在代码里填上你的 DeepSeek Key</span>';
    return;
  }
  sub.innerHTML = '<span class="loading">……正在发生（首次可能稍慢）</span>';
  try{
    const ev = await callAI(op, detail);
    const dur = ev.duration_min || 20;
    advance(dur);
    if(ev.status_change){
      for(const [name, ch] of Object.entries(ev.status_change)){
        const c = state.characters.find(x=>x.name===name);
        if(c && ch){
          if(ch.心情!=null) c.status.心情 = ch.心情;
          if(ch.性欲!=null) c.status.性欲 = ch.性欲;
          if(ch.位置!=null) c.status.位置 = ch.位置;
        }
      }
    }
    state.logs.push({
      day: state.day, time: fmtClock(), dur,
      title: ev.event_title || "一件小事",
      scene: {
        身体: ev.身体描写||"", 语言: ev.语言描写||"",
        神态: ev.神态描写||"", 细节: ev.细节描写||""
      },
      narr: ev.攻的碎念||"",
      star: !!ev.star
    });
    renderClock();
    renderLog();
    sub.innerHTML = '';
    renderSub();
  }catch(e){
    sub.innerHTML = '<span class="err">'+e.message+'</span>';
  }
}

function renderLog(){
  const box = document.getElementById('log');
  if(!state.logs.length){
    box.innerHTML = '<div class="empty">还没发生什么。<br>从下面挑一件事做吧。</div>';
    return;
  }
  box.innerHTML = '';
  state.logs.slice().reverse().forEach(l=>{
    const div = document.createElement('div');
    div.className = 'log-item' + (l.star?' star':'');
    div.innerHTML = `
      <div class="log-meta">${l.time} · 约 ${l.dur} 分钟 ${l.star?'· ★':''}</div>
      <div class="log-title">${l.title}</div>
      ${l.scene.身体?`<div class="scene"><span class="lbl">身体</span>${l.scene.身体}</div>`:''}
      ${l.scene.语言?`<div class="scene"><span class="lbl">语言</span><span class="voice">${l.scene.语言}</span></div>`:''}
      ${l.scene.神态?`<div class="scene"><span class="lbl">神态</span>${l.scene.神态}</div>`:''}
      ${l.scene.细节?`<div class="scene"><span class="lbl">细节</span>${l.scene.细节}</div>`:''}
      ${l.narr?`<div class="narr">${l.narr}</div>`:''}
    `;
    box.appendChild(div);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

renderClock();
document.getElementById('attackNow').innerHTML =
  `攻：<span class="tag">${state.attack.当前在做什么}</span>`;
renderLog();
</script>
